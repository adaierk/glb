name: TOEO v21 full portable Windows acceptance
on:
  push:
    branches: [toeo-v21-full-portable-20261025]
    paths: [packaging/**, .github/workflows/toeo-v21-full-portable.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  full-portable:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [combat, equipment]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 37899580886
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: toeo-original-client-preserved
          path: ${{ runner.temp }}/TOEO_INPUT
      - name: Build clean full package with bundled dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:RUNNER_TEMP 'TOEO_INPUT'
          $env:PYTHONIOENCODING='utf-8'
          New-Item -ItemType Directory -Force "$base/raw","$base/wheels","$base/full","$base/report" | Out-Null
          & "${env:ProgramFiles}\7-Zip\7z.exe" x -y "-o$base/raw" "$base/client_pack.7z" | Out-Null
          if($LASTEXITCODE -ne 0){throw 'Client extraction failed'}
          Invoke-WebRequest 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile "$base/python.zip"
          & python -m pip download --only-binary=:all: --platform win_amd64 --python-version 3.11 --implementation cp --abi cp311 --dest "$base/wheels" 'frida==17.24.3' 'pillow==11.3.0'
          if($LASTEXITCODE -ne 0){throw 'Runtime download failed'}
          & python packaging/build_full_package.py --v21 toeo-recovery/v21/TOEO_Local_World_Recovery_20261010_v21.zip --original-raw "$base/raw" --python "$base/python.zip" --wheels "$base/wheels" --out "$base/full/TOEO_v21_Full"
          if($LASTEXITCODE -ne 0){throw 'Build failed'}
          $full="$base/full/TOEO_v21_Full"
          Set-Location $full
          & cmd /c 'Start_TOEO.cmd --check' 2>&1 | Tee-Object "$base/report/portable_entry_check.txt"
          if($LASTEXITCODE -ne 0){throw 'Actual CMD entry self-check failed'}
          & "$full/runtime/python/python.exe" -m unittest discover -s toeo-tests 2>&1 | Tee-Object "$base/report/portable_unit_tests.txt"
          if($LASTEXITCODE -ne 0){throw 'Bundled interpreter server regression failed'}
      - name: Native battle with the bundled interpreter and packaged source
        if: matrix.mode == 'combat'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONIOENCODING='utf-8'
          $base=Join-Path $env:RUNNER_TEMP 'TOEO_INPUT'
          $full="$base/full/TOEO_v21_Full"
          Set-Location $full
          & "$full/runtime/python/python.exe" -u toeo-tests/ci_original_client.py "$full/original_game" "$base/report/combat" --duration 210 --combat-check --battle-command-check 2>&1 | Tee-Object "$base/report/combat_driver.txt"
          if($LASTEXITCODE -ne 0){throw 'Native portable combat failed'}
      - name: Native equipment and saved map reentry
        if: matrix.mode == 'equipment'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONIOENCODING='utf-8'
          $base=Join-Path $env:RUNNER_TEMP 'TOEO_INPUT'
          $full="$base/full/TOEO_v21_Full"
          Set-Location $full
          & "$full/runtime/python/python.exe" -u toeo-tests/ci_original_client.py "$full/original_game" "$base/report/equipment" --duration 190 --equipment-check 2>&1 | Tee-Object "$base/report/equipment_driver.txt"
          if($LASTEXITCODE -ne 0){throw 'Portable equipment failed'}
          & "$full/runtime/python/python.exe" -u toeo-tests/ci_original_client.py "$full/original_game" "$base/report/reentered" --duration 180 --equipment-check --reenter-check --database "$base/report/equipment/local_accounts.sqlite" 2>&1 | Tee-Object "$base/report/reentered_driver.txt"
          if($LASTEXITCODE -ne 0){throw 'Portable saved equipment/map reentry failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toeo-v21-full-portable-${{ matrix.mode }}
          path: ${{ runner.temp }}/TOEO_INPUT/report
          retention-days: 90
