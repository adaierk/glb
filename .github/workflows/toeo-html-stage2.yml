name: TOEO HTML Stage 2 offline build
on:
  push:
    branches: [toeo-html-stage2-20261010]
    paths:
      - 'toeo-html/**'
      - '.github/workflows/toeo-html-stage2.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  html-stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the self-contained offline game
        run: |
          python -m pip install -q Pillow playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m playwright install --with-deps chromium
          python toeo-html/build_stage2.py
          python toeo-html/verify_stage2.py
      - name: Save browser screenshots and playable packages
        run: |
          git config user.name "TOEO HTML CI"
          git config user.email "toeo-html-ci@users.noreply.github.com"
          git add toeo-html/evidence-stage2 toeo-html/TOEO_HTML_Stage2.zip toeo-html/TOEO_HTML_Stage2_Screenshots.zip
          if ! git diff --cached --quiet; then
            git commit -m "Add offline combat stage and browser evidence [skip ci]"
            git pull --rebase origin toeo-html-stage2-20261010
            git push origin HEAD:toeo-html-stage2-20261010
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toeo-html-stage2-files
          path: |
            toeo-html/TOEO_HTML_Stage2.zip
            toeo-html/TOEO_HTML_Stage2_Screenshots.zip
            toeo-html/evidence-stage2
          retention-days: 90
