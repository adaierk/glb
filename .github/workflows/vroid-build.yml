name: VRoid UI Probe
on:
  push:
    branches:
      - chatgpt-vroid-build-20260928
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download and install
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\vroidwork" | Out-Null
          curl.exe -L --fail --retry 3 --connect-timeout 30 "https://download.vroid.com/dist/nyRtST8DUd/VRoidStudio-v1.26.0-win.exe" -o "$env:USERPROFILE\vroidwork\vroid-installer.exe"
          curl.exe -L --fail --retry 3 --connect-timeout 30 "https://raw.githubusercontent.com/kyoki-railway/fuseishi-character-3d/main/managura-nanako.vroid" -o "$env:USERPROFILE\vroidwork\base.vroid"
          Start-Process "$env:USERPROFILE\vroidwork\vroid-installer.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
      - name: Launch and probe
        shell: powershell
        run: |
          python -m pip install --quiet pillow pyautogui
          @'
          import os,time,glob,subprocess,pyautogui
          from PIL import ImageGrab
          work=os.path.expanduser('~/vroidwork')
          exe=(glob.glob(r'C:\Program Files\**\VRoidStudio.exe',recursive=True)+glob.glob(os.path.expandvars(r'%LOCALAPPDATA%\**\VRoidStudio.exe'),recursive=True))[0]
          subprocess.Popen([exe])
          time.sleep(30)
          def shot(name):
              ImageGrab.grab(all_screens=True).save(os.path.join(work,name))
          shot('00-start.png')
          pyautogui.click(512,613)
          time.sleep(6)
          shot('01-after-get-started.png')
          '@ | Set-Content "$env:USERPROFILE\vroidwork\probe.py"
          python "$env:USERPROFILE\vroidwork\probe.py"
      - uses: actions/upload-artifact@v4
        with:
          name: vroid-ui-probe
          path: ~/vroidwork/*.png
