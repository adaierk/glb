name: VRoid Open Base
on:
  push:
    branches:
      - chatgpt-vroid-build-20260928
jobs:
  open:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Download and install
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\vroidwork" | Out-Null
          curl.exe -L --fail --retry 3 --connect-timeout 30 "https://download.vroid.com/dist/nyRtST8DUd/VRoidStudio-v1.26.0-win.exe" -o "$env:USERPROFILE\vroidwork\vroid-installer.exe"
          curl.exe -L --fail --retry 3 --connect-timeout 30 "https://raw.githubusercontent.com/kyoki-railway/fuseishi-character-3d/main/managura-nanako.vroid" -o "$env:USERPROFILE\vroidwork\base.vroid"
          Start-Process "$env:USERPROFILE\vroidwork\vroid-installer.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
      - name: Open base project
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class NativeInput {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X, int Y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags,uint dx,uint dy,uint data,UIntPtr extra);
          }
          "@
          function Shot($name) {
            $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
            $bmp.Save("$env:USERPROFILE\vroidwork\$name",[System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          function ClickAt($x,$y) {
            [NativeInput]::SetCursorPos($x,$y) | Out-Null
            Start-Sleep -Milliseconds 250
            [NativeInput]::mouse_event(2,0,0,0,[UIntPtr]::Zero)
            [NativeInput]::mouse_event(4,0,0,0,[UIntPtr]::Zero)
          }
          $exe=(Get-ChildItem "C:\Program Files","$env:LOCALAPPDATA" -Recurse -Filter VRoidStudio.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          Start-Process $exe
          Start-Sleep 25
          ClickAt 512 613
          Start-Sleep 3
          ClickAt 512 538
          Start-Sleep 6
          Shot "01-after-agree.png"
          [System.Windows.Forms.SendKeys]::SendWait("^o")
          Start-Sleep 3
          Shot "02-open-dialog.png"
          [System.Windows.Forms.SendKeys]::SendWait("$env:USERPROFILE\vroidwork\base.vroid")
          Start-Sleep -Milliseconds 500
          [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Start-Sleep 35
          Shot "03-base-opened.png"
      - uses: actions/upload-artifact@v4
        with:
          name: vroid-open-base
          path: ~/vroidwork/*.png
