name: VRoid PyAuto Probe
on:
  push:
    branches:
      - chatgpt-vroid-build-20260928
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Prepare
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\vroidwork2" | Out-Null
          curl.exe -L --fail --retry 3 --connect-timeout 30 "https://download.vroid.com/dist/nyRtST8DUd/VRoidStudio-v1.26.0-win.exe" -o "$env:USERPROFILE\vroidwork2\vroid-installer.exe"
          curl.exe -L --fail --retry 3 --connect-timeout 30 "https://raw.githubusercontent.com/kyoki-railway/fuseishi-character-3d/main/managura-nanako.vroid" -o "$env:USERPROFILE\vroidwork2\base.vroid"
          Start-Process "$env:USERPROFILE\vroidwork2\vroid-installer.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          python -m pip install --quiet pillow pyautogui
      - name: Drive VRoid
        shell: powershell
        run: |
          @'
          import os,time,glob,subprocess,pyautogui
          work=os.path.expanduser('~/vroidwork2')
          exe=(glob.glob(r'C:\Program Files\**\VRoidStudio.exe',recursive=True)+glob.glob(os.path.expandvars(r'%LOCALAPPDATA%\**\VRoidStudio.exe'),recursive=True))[0]
          p=subprocess.Popen([exe])
          time.sleep(25)
          pyautogui.screenshot(os.path.join(work,'00-start.png'))
          pyautogui.click(512,613)
          time.sleep(3)
          pyautogui.screenshot(os.path.join(work,'01-terms.png'))
          pyautogui.click(512,538)
          time.sleep(6)
          pyautogui.screenshot(os.path.join(work,'02-after-agree.png'))
          pyautogui.hotkey('ctrl','o')
          time.sleep(3)
          pyautogui.screenshot(os.path.join(work,'03-open-dialog.png'))
          pyautogui.write(os.path.join(work,'base.vroid'), interval=0.002)
          pyautogui.press('enter')
          time.sleep(35)
          pyautogui.screenshot(os.path.join(work,'04-base.png'))
          try: p.terminate()
          except: pass
          '@ | Set-Content "$env:USERPROFILE\vroidwork2\drive.py"
          python "$env:USERPROFILE\vroidwork2\drive.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vroid-pyauto-probe
          path: ~/vroidwork2/*.png
          if-no-files-found: warn
