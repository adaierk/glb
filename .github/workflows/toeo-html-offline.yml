name: TOEO HTML offline build
on:
  push:
    branches: [toeo-html-offline-20261010]
    paths: [toeo-html/**, .github/workflows/toeo-html-offline.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  html-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 37899580886
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: toeo-original-client-preserved
          path: ${{ runner.temp }}/TOEO_ORIGINAL
      - name: Extract original map and graphics
        if: hashFiles('toeo-html/research/index.json') == ''
        run: |
          python -m pip install -q Pillow
          python toeo-html/extract_assets.py
      - name: Split resources into bounded files
        run: python toeo-html/split_resources.py
      - name: Prepare native map and sprite runtime
        run: |
          python -m pip install -q Pillow
          python toeo-html/prepare_runtime.py
      - name: Build and verify offline HTML
        run: |
          python -m pip install -q Pillow playwright
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python -m playwright install --with-deps chromium
          python toeo-html/build_stage1.py
          python toeo-html/verify_stage1.py
      - name: Retain offline research on isolated branch
        run: |
          git config user.name "TOEO HTML CI"
          git config user.email "toeo-html-ci@users.noreply.github.com"
          git add toeo-html/research toeo-html/evidence toeo-html/TOEO_HTML_Stage1.zip toeo-html/TOEO_HTML_Stage1_Screenshots.zip
          if ! git diff --cached --quiet; then
            git commit -m "Extract original resources for HTML port [skip ci]"
            git pull --rebase origin toeo-html-offline-20261010
            git push origin HEAD:toeo-html-offline-20261010
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toeo-html-resource-research
          path: |
            toeo-html/TOEO_HTML_Stage1.zip
            toeo-html/TOEO_HTML_Stage1_Screenshots.zip
            toeo-html/evidence
          retention-days: 90
