name: TOEO v19 original encounter protocol checks
on:
  push:
    branches: [toeo-local-world-recovery-20261009]
    paths: [.github/workflows/toeo-v19-verify.yml, toeo-tests/emulate_enemy.py, toeo-tests/world_enemy_packets.py, toeo-tests/world_combat_packets.py, toeo-tests/emulate_combat.py]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  native-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 37899580886
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: toeo-original-client-preserved
          path: ${{ runner.temp }}/TOEO_ORIGINAL
      - name: Original x86 enemy protocol and regression checks
        env:
          PYTHONPATH: toeo-tests:toeo-recovery/v13/source_support
        run: |
          python -m pip install -q unicorn pefile capstone
          mkdir -p "$RUNNER_TEMP/TOEO_V19_RAW" toeo-recovery/v19/verification
          7z x -y "-o$RUNNER_TEMP/TOEO_V19_RAW" "$RUNNER_TEMP/TOEO_ORIGINAL/client_pack.7z" DefaultComponent/ToEO_CL.dat >/dev/null
          python -m unittest discover -s toeo-tests -p 'test_*.py' >toeo-recovery/v19/verification/unit_checks.txt 2>&1
          python toeo-tests/emulate_enemy.py "$RUNNER_TEMP/TOEO_V19_RAW/DefaultComponent/ToEO_CL.dat" --out toeo-recovery/v19/verification/native_enemy.json
          python toeo-tests/emulate_combat.py "$RUNNER_TEMP/TOEO_V19_RAW/DefaultComponent/ToEO_CL.dat" --out toeo-recovery/v19/verification/native_battle_record.json
      - name: Preserve protocol evidence
        if: always()
        run: |
          git config user.name "TOEO Recovery CI"
          git config user.email "toeo-recovery-ci@users.noreply.github.com"
          git add toeo-recovery/v19/verification
          if ! git diff --cached --quiet; then
            git commit -m "Record original v19 encounter protocol checks [skip ci]"
            git pull --rebase origin toeo-local-world-recovery-20261009
            git push origin HEAD:toeo-local-world-recovery-20261009
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toeo-v19-protocol-checks
          path: toeo-recovery/v19/verification
          retention-days: 90
