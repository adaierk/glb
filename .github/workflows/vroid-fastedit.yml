name: VRoid Direct Open Test
on:
  push:
    branches:
      - chatgpt-vroid-build-20260928
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 9
    steps:
      - name: Prepare
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\vdo" | Out-Null
          curl.exe -L --fail --retry 3 --connect-timeout 30 "https://download.vroid.com/dist/nyRtST8DUd/VRoidStudio-v1.26.0-win.exe" -o "$env:USERPROFILE\vdo\vroid-installer.exe"
          curl.exe -L --fail --retry 3 --connect-timeout 30 "https://raw.githubusercontent.com/kyoki-railway/fuseishi-character-3d/main/managura-nanako.vroid" -o "$env:USERPROFILE\vdo\base.vroid"
          Start-Process "$env:USERPROFILE\vdo\vroid-installer.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          python -m pip install --quiet pillow pyautogui
      - name: Open
        shell: powershell
        run: |
          @'
          import os,time,glob,subprocess,pyautogui
          w=os.path.expanduser('~/vdo')
          exe=(glob.glob(r'C:\Program Files\**\VRoidStudio.exe',recursive=True)+glob.glob(os.path.expandvars(r'%LOCALAPPDATA%\**\VRoidStudio.exe'),recursive=True))[0]
          p=subprocess.Popen([exe,os.path.join(w,'base.vroid')])
          time.sleep(25)
          pyautogui.screenshot(os.path.join(w,'00.png'))
          # first-run
          pyautogui.click(512,613); time.sleep(2)
          pyautogui.click(512,538); time.sleep(4)
          pyautogui.click(512,602); time.sleep(35)
          pyautogui.screenshot(os.path.join(w,'01.png'))
          subprocess.run(['taskkill','/F','/IM','VRoidStudio.exe'],capture_output=True)
          '@ | Set-Content "$env:USERPROFILE\vdo\go.py"
          python "$env:USERPROFILE\vdo\go.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vroid-direct-open
          path: ~/vdo/*.png
          if-no-files-found: warn
