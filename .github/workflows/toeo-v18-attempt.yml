name: TOEO v18 first visual attempt review
on:
  push:
    branches: [toeo-local-world-recovery-20261009]
    paths: [.github/workflows/toeo-v18-attempt.yml, toeo-recovery/v18/review_attempt.py]
permissions:
  actions: read
  contents: write
jobs:
  actual-pixels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 38019916761
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: toeo-original-gui-baseline
          path: ${{ runner.temp }}/TOEO_V18_ATTEMPT1
      - run: python -m pip install -q pillow && python toeo-recovery/v18/review_attempt.py
      - run: |
          git config user.name "TOEO Recovery CI"
          git config user.email "toeo-recovery-ci@users.noreply.github.com"
          git add toeo-recovery/v18/attempt1
          git commit -m "Record failed v18 clothing attempt actual pixels [skip ci]"
          git push origin HEAD:toeo-local-world-recovery-20261009
