name: TOEO client process and launcher diagnostic
on:
  push:
    branches: [toeo-preservation-audit-20261008]
    paths: [.github/workflows/toeo-launcher-diagnostic.yml]
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 18
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 37767841705
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: toeo-extracted-original-client-temporary
          path: ${{ runner.temp }}/toeo_diag
      - name: Validate game data and trace original launcher startup
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $root=Join-Path $env:RUNNER_TEMP 'toeo_diag'
          $src=Join-Path $root 'src'
          $app=Join-Path $root 'game'
          New-Item -ItemType Directory -Path $src,$app -Force | Out-Null
          $report=Join-Path $root 'diagnostic.txt'
          'TOEO original game executable, resources, and window diagnosis' | Set-Content -Path $report
          $sz=Join-Path ${env:ProgramFiles} '7-Zip\7z.exe'
          & $sz x '-y' "-o$src" (Join-Path $root 'client_pack.7z') 2>&1 | Out-Null
          ('7z extract result='+$LASTEXITCODE) | Add-Content $report
          foreach($name in @('NewComponent1','DefaultComponent')) {
            if(Test-Path (Join-Path $src $name)){ Copy-Item (Join-Path $src $name '*') -Destination $app -Recurse -Force }
          }
          ('Restored files: '+@(Get-ChildItem $app -Recurse -File).Count) | Add-Content $report
          'Top-level app files, header signatures, version info:' | Add-Content $report
          foreach($f in (Get-ChildItem $app -File | Sort-Object Name)) {
            $buf=New-Object byte[] 24
            $fs=[IO.File]::OpenRead($f.FullName);$n=$fs.Read($buf,0,24);$fs.Close()
            $v=[Diagnostics.FileVersionInfo]::GetVersionInfo($f.FullName)
            ('FILE '+$f.Name+' size='+$f.Length+' signature='+([BitConverter]::ToString($buf,0,$n))+' Product='+$v.ProductName+' Desc='+$v.FileDescription+' Org='+$v.CompanyName) | Add-Content $report
          }
          'All large executables and DLL files:' | Add-Content $report
          Get-ChildItem $app -Recurse -File | Where-Object {$_.Extension -in @('.exe','.dll','.icd')} | Sort-Object Length -Descending | Select-Object -First 70 Name,Length,FullName | Format-Table | Out-String -Width 320 | Add-Content $report
          $interop=@'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public class TOEOWindows {
            public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc cb, IntPtr arg);
            [DllImport("user32.dll")] public static extern int GetWindowText(IntPtr handle, StringBuilder text, int size);
            [DllImport("user32.dll")] public static extern int GetClassName(IntPtr handle, StringBuilder text, int size);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr handle, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr handle);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hwnd, out RECT rect);
            [StructLayout(LayoutKind.Sequential)] public struct RECT {public int Left,Top,Right,Bottom;}
          }
'@
          Add-Type -TypeDefinition $interop
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function CaptureWindows([string]$label) {
            $windows=New-Object 'System.Collections.Generic.List[object]'
            $cb=[TOEOWindows+EnumWindowsProc]{param([IntPtr]$h,[IntPtr]$l)
              if([TOEOWindows]::IsWindowVisible($h)){
                $title=[Text.StringBuilder]::new(1024);[void][TOEOWindows]::GetWindowText($h,$title,1024)
                $cls=[Text.StringBuilder]::new(256);[void][TOEOWindows]::GetClassName($h,$cls,256)
                $pidnum=[uint32]0;[void][TOEOWindows]::GetWindowThreadProcessId($h,[ref]$pidnum)
                $rect=[TOEOWindows+RECT]::new();[void][TOEOWindows]::GetWindowRect($h,[ref]$rect)
                $windows.Add([PSCustomObject]@{Handle=$h;PID=$pidnum;Title=$title.ToString();Class=$cls.ToString();L=$rect.Left;T=$rect.Top;R=$rect.Right;B=$rect.Bottom})
              };return $true
            }
            [void][TOEOWindows]::EnumWindows($cb,[IntPtr]::Zero)
            ('WINDOWS '+$label+' '+($windows|ConvertTo-Json -Compress -Depth 3)) | Add-Content $report
            $targets=$windows | Where-Object {$_.Title -match 'Tales|Eternia|TOEO|テイルズ|????' -or $_.Class -match 'IEFrame'}
            foreach($w in $targets){
              $wide=$w.R-$w.L; $high=$w.B-$w.T
              if($wide -gt 200 -and $high -gt 160 -and $wide -lt 3200 -and $high -lt 2500) {
                try {
                  $img=[Drawing.Bitmap]::new($wide,$high)
                  $g=[Drawing.Graphics]::FromImage($img)
                  $g.CopyFromScreen([Drawing.Point]::new($w.L,$w.T),[Drawing.Point]::Empty,[Drawing.Size]::new($wide,$high))
                  $name='CAPTURE_'+$label+'_'+$w.PID+'_'+[Math]::Abs($w.Handle.ToInt64())+'.png'
                  $img.Save((Join-Path $root $name),[Drawing.Imaging.ImageFormat]::Png)
                  $g.Dispose();$img.Dispose()
                  ('CAPTURED '+$label+' '+$name+' title='+$w.Title) | Add-Content $report
                }catch{ ('Capture error: '+$_) | Add-Content $report }
              }
            }
            ('PROCESSES '+$label) | Add-Content $report
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'ToE|Checker|Launcher|iexplore|mshta|werfault' -or $_.CommandLine -match 'TOEO|Eternia|ToEO' } | Select-Object Name,ProcessId,ParentProcessId,CommandLine | Format-List | Out-String -Width 420 | Add-Content $report
          }
          $exe=Join-Path $app 'ToEOnline.exe'
          ('LAUNCH '+$exe) | Add-Content $report
          $ruleName='TOEO_STUDY_'+[Guid]::NewGuid().ToString('N')
          try { New-NetFirewallRule -DisplayName $ruleName -Direction Outbound -Action Block -Program $exe | Out-Null } catch {}
          CaptureWindows 'before'
          try {
            $p=Start-Process -FilePath $exe -WorkingDirectory $app -PassThru -ErrorAction Stop
            Start-Sleep -Milliseconds 1600
            $p.Refresh()
            ('At_1_6s: PID='+$p.Id+' exited='+$p.HasExited) | Add-Content $report
            CaptureWindows 'after2sec'
            Start-Sleep -Seconds 7
            $p.Refresh()
            ('At_9s: PID='+$p.Id+' exited='+$p.HasExited) | Add-Content $report
            CaptureWindows 'after9sec'
            if(!$p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }catch{ ('Game launch exception: '+$_) | Add-Content $report }
          Remove-NetFirewallRule -DisplayName $ruleName -ErrorAction SilentlyContinue
          Get-Content $report | Select-Object -Last 75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toeo-launcher-process-diagnostics
          path: |
            ${{ runner.temp }}/toeo_diag/diagnostic.txt
            ${{ runner.temp }}/toeo_diag/CAPTURE_*.png
          if-no-files-found: warn
          retention-days: 7