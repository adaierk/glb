name: TOEO game launcher process probe
on:
  push:
    branches: [toeo-preservation-audit-20261008]
    paths: [.github/workflows/toeo-launcher-diagnostic.yml]
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 37767841705
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: toeo-extracted-original-client-temporary
          path: ${{ runner.temp }}/toeo_diag
      - name: Inspect original game launcher
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $root=Join-Path $env:RUNNER_TEMP 'toeo_diag'
          $raw=Join-Path $root 'raw'
          $app=Join-Path $root 'game'
          New-Item -ItemType Directory -Force $raw,$app | Out-Null
          $report=Join-Path $root 'diagnostic.txt'
          'TOEO executable and process diagnostics' | Set-Content $report
          $seven=Join-Path ${env:ProgramFiles} '7-Zip\7z.exe'
          & $seven x -y "-o$raw" (Join-Path $root 'client_pack.7z') | Out-Null
          foreach($name in @('NewComponent1','DefaultComponent')) {
            $group=Join-Path $raw $name
            if(Test-Path $group){Copy-Item (Join-Path $group '*') -Destination $app -Recurse -Force}
          }
          ('Files='+@(Get-ChildItem $app -Recurse -File).Count) | Add-Content $report
          foreach($f in (Get-ChildItem $app -File | Sort-Object Name)) {
            $b=New-Object byte[] 20; $s=[IO.File]::OpenRead($f.FullName);$n=$s.Read($b,0,20);$s.Close()
            ('FILE '+$f.Name+' bytes='+$f.Length+' header='+[BitConverter]::ToString($b,0,$n)) | Add-Content $report
          }
          $exe=Join-Path $app 'ToEOnline.exe'
          $rule='TOEO_OFFLINE_'+[Guid]::NewGuid().ToString('N')
          try {New-NetFirewallRule -DisplayName $rule -Program $exe -Direction Outbound -Action Block | Out-Null} catch {}
          $before=@(Get-CimInstance Win32_Process | Select-Object ProcessId,Name,ParentProcessId,CommandLine)
          try {
            $p=Start-Process -FilePath $exe -WorkingDirectory $app -PassThru -ErrorAction Stop
            Start-Sleep -Seconds 2
            $p.Refresh()
            ('After2s PID='+$p.Id+' exited='+$p.HasExited+' window='+$p.MainWindowHandle+' title='+$p.MainWindowTitle) | Add-Content $report
            $after=@(Get-CimInstance Win32_Process | Select-Object ProcessId,Name,ParentProcessId,CommandLine)
            $new=@($after | Where-Object { $_.ProcessId -notin $before.ProcessId })
            ('New process list: '+($new | Format-List | Out-String -Width 240)) | Add-Content $report
            Start-Sleep -Seconds 6
            $p.Refresh()
            ('After8s PID='+$p.Id+' exited='+$p.HasExited+' window='+$p.MainWindowHandle+' title='+$p.MainWindowTitle) | Add-Content $report
            if($p.HasExited){('ExitCode='+$p.ExitCode)|Add-Content $report}
            $windows=Get-Process | Where-Object { $_.MainWindowHandle -ne 0 } | Select-Object Name,MainWindowTitle,MainWindowHandle
            ('VisibleWindows '+($windows | Format-Table | Out-String -Width 250)) | Add-Content $report
            if (!$p.HasExited -and $p.MainWindowHandle -ne 0) {
              Add-Type -AssemblyName System.Windows.Forms
              Add-Type -AssemblyName System.Drawing
              $b=[Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp=[Drawing.Bitmap]::new($b.Width,$b.Height)
              $g=[Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location,[Drawing.Point]::Empty,$b.Size)
              $bmp.Save((Join-Path $root 'REAL_ToEOnline.png'),[Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose();$bmp.Dispose()
              'Real screenshot saved' | Add-Content $report
            }
            if(!$p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }catch{('Launch exception '+$_)|Add-Content $report}
          Remove-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue
          Get-Content $report | Select-Object -Last 45
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toeo-launcher-process-diagnostics
          path: |
            ${{ runner.temp }}/toeo_diag/diagnostic.txt
            ${{ runner.temp }}/toeo_diag/REAL_ToEOnline.png
          if-no-files-found: warn