name: VRoid Steam Diagnostic
on:
  push:
    branches:
      - chatgpt-vroid-inspect-20260928
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Install SteamCMD manually
        run: |
          mkdir -p "$HOME/steamcmd"
          curl -L --fail --retry 3 https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz -o /tmp/steamcmd.tar.gz
          tar -xzf /tmp/steamcmd.tar.gz -C "$HOME/steamcmd"
          "$HOME/steamcmd/steamcmd.sh" +quit
      - name: Try anonymous VRoid download
        continue-on-error: true
        run: |
          mkdir -p "$HOME/vroidapp"
          "$HOME/steamcmd/steamcmd.sh" +@sSteamCmdForcePlatformType windows +force_install_dir "$HOME/vroidapp" +login anonymous +app_update 1486350 validate +quit 2>&1 | tee "$HOME/steamcmd-vroid.log"
      - name: Report
        run: |
          find "$HOME/vroidapp" -maxdepth 4 -type f | head -200 > "$HOME/files.txt" || true
          echo "--- files ---"
          cat "$HOME/files.txt"
          echo "--- steamcmd tail ---"
          tail -250 "$HOME/steamcmd-vroid.log" || true
      - uses: actions/upload-artifact@v4
        with:
          name: steam-vroid-diagnostic
          path: |
            ~/steamcmd-vroid.log
            ~/files.txt
          if-no-files-found: warn
