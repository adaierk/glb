name: VRoid Windows GUI Diagnostic
on:
  push:
    branches:
      - chatgpt-vroid-inspect-20260928
jobs:
  gui:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download installer and base model
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\vroidwork" | Out-Null
          Invoke-WebRequest -Uri "https://download.vroid.com/dist/dxy77TdlP1/VRoidStudio-v2.13.0-win.exe" -OutFile "$env:USERPROFILE\vroidwork\vroid-installer.exe"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/kyoki-railway/fuseishi-character-3d/main/managura-nanako.vroid" -OutFile "$env:USERPROFILE\vroidwork\base.vroid"
      - name: Install VRoid
        shell: powershell
        run: |
          Start-Process -FilePath "$env:USERPROFILE\vroidwork\vroid-installer.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          Get-ChildItem "C:\Program Files","$env:LOCALAPPDATA" -Recurse -Filter VRoidStudio.exe -ErrorAction SilentlyContinue | Select-Object -First 10 FullName | Out-File "$env:USERPROFILE\vroidwork\found.txt"
          Get-Content "$env:USERPROFILE\vroidwork\found.txt"
      - name: Prepare project
        shell: powershell
        run: |
          $dir = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'vroid\avatars'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "$env:USERPROFILE\vroidwork\base.vroid" (Join-Path $dir 'reference_base.vroid') -Force
      - name: Launch and screenshot
        shell: powershell
        run: |
          $exe = (Get-ChildItem "C:\Program Files","$env:LOCALAPPDATA" -Recurse -Filter VRoidStudio.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $exe) { throw "VRoidStudio.exe not found" }
          Start-Process -FilePath $exe
          Start-Sleep -Seconds 25
          python -m pip install pillow pyautogui
          @'
          from PIL import ImageGrab
          import time, os
          img=ImageGrab.grab(all_screens=True)
          out=os.path.expanduser('~/vroidwork/screen.png')
          img.save(out)
          print(img.size, out)
          '@ | Set-Content "$env:USERPROFILE\vroidwork\shot.py"
          python "$env:USERPROFILE\vroidwork\shot.py"
          Get-Process | Where-Object {$_.ProcessName -match 'VRoid'} | Format-Table -AutoSize | Out-File "$env:USERPROFILE\vroidwork\processes.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: vroid-windows-gui-diag
          path: |
            ~/vroidwork/screen.png
            ~/vroidwork/found.txt
            ~/vroidwork/processes.txt
