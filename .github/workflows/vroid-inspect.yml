name: VRoid Steam Diagnostic
on:
  push:
    branches:
      - chatgpt-vroid-inspect-20260928
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Install steamcmd
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y steamcmd lib32gcc-s1
      - name: Try anonymous VRoid download
        continue-on-error: true
        run: |
          mkdir -p "$HOME/vroidapp"
          /usr/games/steamcmd +@sSteamCmdForcePlatformType windows +force_install_dir "$HOME/vroidapp" +login anonymous +app_update 1486350 validate +quit 2>&1 | tee "$HOME/steamcmd-vroid.log"
      - name: Report
        run: |
          find "$HOME/vroidapp" -maxdepth 3 -type f | head -100 > "$HOME/files.txt" || true
          echo "--- files ---"
          cat "$HOME/files.txt"
          echo "--- steamcmd tail ---"
          tail -200 "$HOME/steamcmd-vroid.log" || true
      - uses: actions/upload-artifact@v4
        with:
          name: steam-vroid-diagnostic
          path: |
            ~/steamcmd-vroid.log
            ~/files.txt
          if-no-files-found: warn
